<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>지성 · 지연 청첩장 관리</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./participation.css"><script type="module" src="./admin.js"></script></head>
<body><main class="admin-shell"><a class="text-button" href="./">← 청첩장으로</a><h1>우리의 초대 기록</h1><p>축하 메시지와 참석 응답을 확인하고, 청첩장 사진첩을 꾸며요.</p><p id="admin-feedback" class="admin-feedback" role="status"></p>
<form id="admin-login" class="admin-login"><label>관리자 이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">로그인</button></form>
<div id="admin-content" hidden><div class="admin-toolbar"><button id="admin-refresh" class="button button-outline" type="button">새로고침</button><button id="admin-export" class="button button-outline" type="button">참석 명단 CSV 저장</button><button id="admin-logout" class="text-button" type="button">로그아웃</button></div>
<section class="admin-section"><h2>청첩장 사진첩</h2><p class="small-note">사진·영상을 게시하면 청첩장의 ‘우리의 순간들’에 바로 표시돼요. 방문자 누구나 볼 수 있어요.</p>
<form id="admin-album-upload" class="admin-upload"><label>추가할 사진 또는 영상<input name="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" required></label><p class="small-note">사진 JPG · PNG · WEBP, 최대 8MB / 영상 MP4 · WEBM, 최대 50MB<br>아이폰 HEIC 사진은 JPG로 변환해 주세요.</p><div id="admin-upload-preview" class="admin-upload-preview"></div><label>함께 남길 한마디 <span class="small-note">선택</span><input name="caption" maxlength="200" placeholder="함께 웃었던 그날"></label><p id="admin-upload-status" class="admin-feedback" role="status"></p><button class="button" type="submit">청첩장에 게시하기</button></form>
<p class="small-note">처음 제공한 기본 사진 뒤에 업로드한 순서대로 추가돼요. 아래에서 추가한 사진의 설명을 수정하거나 삭제할 수 있어요.</p><div id="admin-album"></div><button id="admin-album-more" class="text-button" type="button" hidden>더 불러오기</button></section>
<section class="admin-section"><h2>참석 응답</h2><p id="admin-summary" class="admin-summary"></p><div id="admin-rsvps"></div></section>
<section class="admin-section"><h2>축하 방명록</h2><div id="admin-guestbook"></div><button id="admin-guestbook-more" class="text-button" type="button" hidden>더 불러오기</button></section>

</div></main></body></html>
